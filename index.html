<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Lexend+Deca&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Stats preview card component</title>
  </head>
  <body>
    <main class="stats-preview-card">
      <div class="stats-preview-card-image">
        <picture class="hero-image">
          <source
            class="desktop-image"
            srcset="./images/image-header-desktop.jpg"
            media="(min-width= 75rem)"
          />
          <img
            class="mobile-image"
            src="./images/image-header-mobile.jpg"
            alt="Employees collaborating at a table with their laptops"
          />
        </picture>
      </div>
      <div class="stats-preview-content">
        <section class="stats-preview-text">
          <h1 class="stats-preview-heading">
            Get <span class="purple">insights</span> that help your business
            grow.
          </h1>
          <p class="stats-preview-discover">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
        </section>
        <section class="stats">
          <div class="stat">
            <p class="stats-value">10k+</p>
            <p class="stats-category">companies</p>
          </div>
          <div class="stat">
            <p class="stats-value">314</p>
            <p class="stats-category">templates</p>
          </div>
          <div class="stat">
            <p class="stats-value">12m+</p>
            <p class="stats-category">queries</p>
          </div>
        </section>
      </div>
    </main>
    <footer class="credits">
      Challenge by
      <a
        href="https://www.frontendmentor.io/challenges/stats-preview-card-component-8JqbgoU62"
        >Frontend Mentor</a
      >. Coded by <a href="https://github.com/FREExM1ND">Aaron Robbins</a>.
    </footer>
  </body>
</html>
